<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>データフローマップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <div>
    <h1>データフローマップ</h1>
    <p class="sub" id="sync">読み込み中…</p>
  </div>
  <div class="stats" id="stats"></div>
</header>

<main>
  <details id="filters" class="pane" open>
    <summary>絞り込み</summary>
    <div class="fgroup"><span class="lbl">データベース / スキーマ</span>
      <div class="btnrow"><button class="btn mini" id="b-sch-all">すべて選択</button><button class="btn mini" id="b-sch-none">すべて解除</button></div>
      <div id="f-db" class="tree"></div></div>
    <div class="fgroup"><span class="lbl">種別</span><div id="f-type"></div></div>
    <div class="fgroup"><label class="lbl" for="f-tag">タグ</label><select id="f-tag"></select></div>
    <div class="fgroup"><label class="lbl" for="f-owner">オーナー</label><select id="f-owner"></select></div>
    <div class="fgroup"><span class="lbl">表示</span>
      <label class="chk"><input type="checkbox" id="f-proc" checked>タスク・プロシージャを表示</label>
    </div>
    <div class="fgroup"><label class="lbl" for="f-hops">選択ノードからの範囲</label>
      <input type="range" id="f-hops" min="1" max="6" value="6" disabled>
      <span class="rangeval" id="f-hops-val">すべて</span>
      <span class="hint">ノードを選ぶと、上流・下流を指定ホップ数まで絞って表示します。</span>
    </div>
    <div class="btnrow"><button class="btn" id="b-fit">全体を表示</button><button class="btn" id="b-clear">選択を解除</button></div>
  </details>

  <section id="graphwrap" class="pane" aria-label="データフローグラフ">
    <div id="searchbox">
      <input type="search" id="q" placeholder="テーブル名・カラム名で検索（Enterで選択）" autocomplete="off">
      <div id="matches" hidden></div>
    </div>
    <div id="cy"></div>
    <div id="colwrap" hidden>
      <div class="colbar"><span class="lbl">カラムのリネージ</span><b class="mono" id="colroot"></b>
        <span class="hint">線のラベルは変換式。カラムをクリックするとそこから追跡し直します。</span>
        <button class="btn" id="b-colback">テーブル図に戻る</button></div>
      <div id="cy2"></div>
    </div>
    <div id="legend">
      <span class="lg"><i class="l-line"></i>データの流れ（SQL から解析）</span>
      <span class="lg"><i class="l-dia"></i>タスク／プロシージャ</span>
      <span class="lg" style="grid-column:1/-1"><span class="mono">↓3（全9）· 更新 毎日06:30</span>＝直接の後続3・下流全体9・更新頻度</span>
      <span class="lg cscale" style="grid-column:1/-1" id="legend-color"></span>
    </div>
  </section>

  <aside id="detail" class="pane" aria-live="polite"></aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
